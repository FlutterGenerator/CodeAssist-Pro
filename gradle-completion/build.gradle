plugins {
    id 'com.android.library'
}

apply plugin: 'kotlin-android'
apply plugin: 'com.diffplug.spotless'

android {
    compileSdk rootProject.ext.compileSdkVersion
    namespace = "com.tyron.completion.gradle"

    spotless {
        java {
            target "**/*.java"
            googleJavaFormat()
        }
    }

    defaultConfig {
        minSdk rootProject.ext.minSdkVersion
        targetSdk rootProject.ext.targetSdkVersion

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    buildFeatures {
        buildConfig = true
    }
}

dependencies {
    implementation project(':actions-api')
    implementation project(':editor-api')
    implementation project(':common')
    implementation project(':completion-api')
    implementation project(':language-api')
    implementation project(':fileeditor-api')
    implementation project(':logging')
    implementation project(':code-editor')
    
    implementation ('org.jetbrains.kotlin:kotlin-stdlib:2.3.0')
    api ('io.github.rosemoe:editor:0.24.4')
}
