plugins {
//    alias(libs.plugins.sentry)
}
apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'com.diffplug.spotless'

def propsOrEnv(String name) {
    return project.findProperty(name) ?: System.getenv(name) ?: ""
}

android {
    compileSdkVersion rootProject.ext.compileSdkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    namespace = rootProject.ext.applicationId

    Properties myProps = new Properties()
        def propsFile = file("../local.properties")
        if (propsFile.exists()) {
            myProps.load(new FileInputStream(propsFile))
        }


    spotless {
        java {
            target "**/*.java"
            googleJavaFormat()
        }
    }

    defaultConfig {
        targetSdkVersion rootProject.ext.targetSdkVersion
        minSdkVersion rootProject.ext.minSdkVersion
        applicationId rootProject.ext.applicationId
        versionCode rootProject.ext.versionCode
        versionName rootProject.ext.versionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    compileOptions {
        coreLibraryDesugaringEnabled = true
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
        }

        unitTests.all {
            systemProperty 'robolectric.enabledSdks', '26'
        }
    }

    signingConfigs {
        debug {
            storeFile file('codeassist.keystore')
            keyAlias 'codeassist'
            storePassword 'codeassist'
            keyPassword 'codeassist'
        }
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.debug
            minifyEnabled false
            shrinkResources = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            manifestPlaceholders["sentryDsn"] = myProps.getProperty("sentryDsnDebug")?: propsOrEnv("SENTRY_DSN_DEBUG")
        }
        debug {
            signingConfig = signingConfigs.debug
            manifestPlaceholders["sentryDsn"] = myProps.getProperty("sentryDsnDebug")?: propsOrEnv("SENTRY_DSN_DEBUG")
        }
    }

    // not needed
//    splits {
//        abi {
//            enable true
//            reset()
//
//            include "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
//
//            universalApk true
//        }
//    }

    buildFeatures {
        viewBinding = true
        buildConfig = true
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
        resources.excludes += "license/*"
        exclude "plugin.properties"
        exclude "plugin.xml"
        exclude "about.html"
        exclude ".api_description"
        exclude 'api_database/*'
        exclude "about_files/*"
        exclude "META-INF/eclipse.inf"
        pickFirst "META-INF/native-image/reflect-config.json"
        exclude "README.md"
        exclude "META-INF/maven/*"
        pickFirst "META-INF/sisu/*"
        pickFirst "*/*.kotlin_builtins"
        pickFirst "*/*/*.kotlin_builtins"
        pickFirst "*/*/*/*.kotlin_builtins"
        pickFirst "kotlin/concurrent/atomics/atomics.kotlin_builtins"
        pickFirst("META-INF/jandex.idx")
        pickFirst("META-INF/gradle/incremental.annotation.processors")
        pickFirst("META-INF/INDEX.LIST")
        pickFirst("sun/tools/serialver/resources/*")

        //exclude 'com/sun/tools/javac/resources/legacy.properties'

    }

}

configurations.implementation {
    //  exclude group: "org.jetbrains", module: "annotations"
    exclude group: 'com.android.tools', module: 'common'
    exclude group: "org.jetbrains.kotlin", module: "kotlin-reflect"
